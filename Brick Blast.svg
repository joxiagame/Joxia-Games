<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="24" x2="400" y2="24"/><line x1="0" y1="48" x2="400" y2="48"/>
    <line x1="0" y1="72" x2="400" y2="72"/><line x1="0" y1="96" x2="400" y2="96"/>
    <line x1="0" y1="120" x2="400" y2="120"/><line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="0" y1="168" x2="400" y2="168"/><line x1="0" y1="192" x2="400" y2="192"/>
  </g>

  <rect x="52" y="50" width="296" height="96" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- briques -->
  <rect x="76" y="58" width="56" height="24" rx="6" fill="#e64a19"/>
  <rect x="140" y="58" width="56" height="24" rx="6" fill="#f4511e"/>
  <rect x="204" y="58" width="56" height="24" rx="6" fill="#ff9a4d"/>
  <rect x="268" y="58" width="56" height="24" rx="6" fill="#ffb347"/>

  <!-- balle -->
  <circle cx="200" cy="112" r="16" fill="#ff9a4d" filter="url(#glow)"/>
  <circle cx="200" cy="112" r="9" fill="#ffffff"/>
  <ellipse cx="197" cy="109" rx="3" ry="2" fill="#e9e9e9" fill-opacity="0.6"/>

  <!-- raquette -->
  <rect x="164" y="128" width="72" height="9" rx="4.5" fill="#ffd54a"/>
  <rect x="164" y="128" width="72" height="9" rx="4.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- wordmark -->
  <text x="200" y="184" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="2">
    <tspan fill="#ff8a4d">BRICK</tspan><tspan fill="#e8eef6"> BLAST</tspan>
  </text>
  <line x1="150" y1="196" x2="250" y2="196" stroke="#ff8a4d" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="200" y="218" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2" fill="#8892a8">CASSE-BRIQUES</text>
</svg>
