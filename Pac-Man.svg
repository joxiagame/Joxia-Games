<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="24" x2="400" y2="24"/><line x1="0" y1="48" x2="400" y2="48"/>
    <line x1="0" y1="72" x2="400" y2="72"/><line x1="0" y1="96" x2="400" y2="96"/>
    <line x1="0" y1="120" x2="400" y2="120"/><line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="0" y1="168" x2="400" y2="168"/><line x1="0" y1="192" x2="400" y2="192"/>
  </g>

  <rect x="52" y="50" width="296" height="96" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- halos -->
  <g filter="url(#glow)">
    <circle cx="130" cy="98" r="28" fill="#ffd54a"/>
    <circle cx="250" cy="98" r="22" fill="#ff2a4d"/>
  </g>

  <!-- pac-man -->
  <polygon points="130,98 153,78.7 149.3,75 135.2,68.5 119.7,69.8 107,78.7 100.5,92.8 101.8,108.3 110.7,121 124.8,127.5 140.3,126.2 153,117.3" fill="#ffd54a"/>

  <!-- fantôme -->
  <path d="M 228 98 L 230.95 87 L 239 78.95 L 250 76 L 261 78.95 L 269.05 87 L 272 98 L 272 122 L 228 122 Z" fill="#ff2a4d"/>

  <!-- yeux -->
  <circle cx="240" cy="91" r="5.5" fill="#ffffff"/>
  <circle cx="260" cy="91" r="5.5" fill="#ffffff"/>
  <circle cx="241" cy="92" r="2.5" fill="#12224d"/>
  <circle cx="261" cy="92" r="2.5" fill="#12224d"/>

  <!-- points -->
  <circle cx="56" cy="98" r="3.5" fill="#ffd54a"/>
  <circle cx="74" cy="98" r="3.5" fill="#ffd54a"/>
  <circle cx="92" cy="98" r="3.5" fill="#ffd54a"/>

  <!-- wordmark -->
  <text x="200" y="184" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="2">
    <tspan fill="#ffd54a">PAC</tspan><tspan fill="#e8eef6">-MAN</tspan>
  </text>
  <line x1="150" y1="196" x2="250" y2="196" stroke="#ffd54a" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="200" y="218" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2" fill="#8892a8">LABYRINTHE</text>
</svg>
