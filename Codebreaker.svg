<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1824"/>
      <stop offset="1" stop-color="#050a10"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bg)"/>

  <!-- fines lignes terminal -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <line x1="0" y1="24" x2="400" y2="24"/><line x1="0" y1="48" x2="400" y2="48"/>
    <line x1="0" y1="72" x2="400" y2="72"/><line x1="0" y1="96" x2="400" y2="96"/>
    <line x1="0" y1="120" x2="400" y2="120"/><line x1="0" y1="144" x2="400" y2="144"/>
    <line x1="0" y1="168" x2="400" y2="168"/><line x1="0" y1="192" x2="400" y2="192"/>
  </g>

  <!-- panneau -->
  <rect x="52" y="50" width="296" height="96" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- halo néon -->
  <g filter="url(#glow)">
    <circle cx="96" cy="98" r="26" fill="#00ffa3"/>
    <circle cx="148" cy="98" r="26" fill="#ff2a4d"/>
    <circle cx="200" cy="98" r="26" fill="#ffcc00"/>
    <circle cx="252" cy="98" r="26" fill="#8b5cf6"/>
    <circle cx="304" cy="98" r="26" fill="#00d4ff"/>
  </g>

  <!-- pions -->
  <g>
    <circle cx="96" cy="98" r="26" fill="#00ffa3"/>
    <circle cx="148" cy="98" r="26" fill="#ff2a4d"/>
    <circle cx="200" cy="98" r="26" fill="#ffcc00"/>
    <circle cx="252" cy="98" r="26" fill="#8b5cf6"/>
    <circle cx="304" cy="98" r="26" fill="#00d4ff"/>
  </g>

  <!-- reflets -->
  <g fill="#ffffff" fill-opacity="0.3">
    <ellipse cx="88" cy="90" rx="8" ry="5.5"/>
    <ellipse cx="140" cy="90" rx="8" ry="5.5"/>
    <ellipse cx="192" cy="90" rx="8" ry="5.5"/>
    <ellipse cx="244" cy="90" rx="8" ry="5.5"/>
    <ellipse cx="296" cy="90" rx="8" ry="5.5"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="184" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="3">
    <tspan fill="#00ffa3">CODE</tspan><tspan fill="#e8eef6">BREAKER</tspan>
  </text>
  <line x1="150" y1="196" x2="250" y2="196" stroke="#00ffa3" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="200" y="218" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2" fill="#8892a8">DÉCHIFFRE LE CODE</text>
</svg>
