<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Crypto Tycoon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131c"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7931a"/>
      <stop offset="1" stop-color="#f6b73c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6b73c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f6b73c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fond -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="450" fill="url(#glow)" opacity="0.5"/>

  <!-- grille -->
  <g stroke="#1e2a38" stroke-width="1">
    <line x1="60" y1="80" x2="760" y2="80"/>
    <line x1="60" y1="150" x2="760" y2="150"/>
    <line x1="60" y1="220" x2="760" y2="220"/>
    <line x1="60" y1="290" x2="760" y2="290"/>
    <line x1="60" y1="360" x2="760" y2="360"/>
  </g>

  <!-- bougies (tendance haussière avec replis) -->
  <g stroke-linecap="round">
    <!-- mèches -->
    <g stroke-width="3">
      <line x1="110" y1="245" x2="110" y2="300" stroke="#16c784"/>
      <line x1="150" y1="225" x2="150" y2="280" stroke="#16c784"/>
      <line x1="190" y1="210" x2="190" y2="260" stroke="#16c784"/>
      <line x1="230" y1="220" x2="230" y2="285" stroke="#ea3943"/>
      <line x1="270" y1="215" x2="270" y2="275" stroke="#16c784"/>
      <line x1="310" y1="190" x2="310" y2="255" stroke="#16c784"/>
      <line x1="350" y1="170" x2="350" y2="235" stroke="#16c784"/>
      <line x1="390" y1="150" x2="390" y2="215" stroke="#16c784"/>
      <line x1="430" y1="160" x2="430" y2="215" stroke="#ea3943"/>
      <line x1="470" y1="140" x2="470" y2="205" stroke="#16c784"/>
      <line x1="510" y1="120" x2="510" y2="185" stroke="#16c784"/>
      <line x1="550" y1="100" x2="550" y2="165" stroke="#16c784"/>
      <line x1="590" y1="80" x2="590" y2="145" stroke="#16c784"/>
    </g>
    <!-- corps -->
    <g stroke-width="20">
      <line x1="110" y1="262" x2="110" y2="290" stroke="#16c784"/>
      <line x1="150" y1="240" x2="150" y2="270" stroke="#16c784"/>
      <line x1="190" y1="228" x2="190" y2="252" stroke="#16c784"/>
      <line x1="230" y1="250" x2="230" y2="278" stroke="#ea3943"/>
      <line x1="270" y1="228" x2="270" y2="265" stroke="#16c784"/>
      <line x1="310" y1="205" x2="310" y2="245" stroke="#16c784"/>
      <line x1="350" y1="185" x2="350" y2="225" stroke="#16c784"/>
      <line x1="390" y1="165" x2="390" y2="205" stroke="#16c784"/>
      <line x1="430" y1="175" x2="430" y2="205" stroke="#ea3943"/>
      <line x1="470" y1="152" x2="470" y2="192" stroke="#16c784"/>
      <line x1="510" y1="132" x2="510" y2="172" stroke="#16c784"/>
      <line x1="550" y1="112" x2="550" y2="152" stroke="#16c784"/>
      <line x1="590" y1="92" x2="590" y2="132" stroke="#16c784"/>
    </g>
  </g>

  <!-- ligne de tendance dorée -->
  <polyline points="110,276 150,255 190,240 230,264 270,246 310,225 350,205 390,185 430,190 470,172 510,152 550,132 590,112"
    fill="none" stroke="#f6b73c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- titre -->
  <text x="400" y="55" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#e7eef6">CRYPTO <tspan fill="url(#gold)">TYCOON</tspan></text>
  <text x="400" y="410" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#8593a5">JOXIA</text>

  <!-- pièce ₿ -->
  <circle cx="72" cy="410" r="26" fill="url(#gold)"/>
  <text x="72" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#1a1206">₿</text>
</svg>
